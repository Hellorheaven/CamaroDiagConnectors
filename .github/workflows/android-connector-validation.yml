name: Android connector validation
on:
  pull_request:
    paths:
      - 'host/android/**'
      - '.github/workflows/android-connector-validation.yml'
  workflow_dispatch:
jobs:
  native-usb-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test portable Java protocol
        run: |
          mkdir -p /tmp/android-protocol
          javac -Xlint:all -Werror -d /tmp/android-protocol host/android/src/main/java/com/camarodiag/connectors/BinaryDiscovery.java host/android/src/test/java/com/camarodiag/connectors/BinaryDiscoveryTest.java
          java -ea -cp /tmp/android-protocol com.camarodiag.connectors.BinaryDiscoveryTest
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35"
      - name: Compile native USB Host adapter
        run: |
          javac -Xlint:all -Werror -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/android-protocol host/android/src/main/java/com/camarodiag/connectors/*.java
