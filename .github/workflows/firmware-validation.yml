name: Firmware validation
on:
  pull_request:
    paths:
      - 'firmware/esp32s3/**'
      - 'firmware/stm32g4/**'
      - 'firmware/shared/**'
      - '.github/workflows/firmware-validation.yml'
  workflow_dispatch:
jobs:
  native-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run native USB parser tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic firmware/esp32s3/native-tests/discovery_parser_test.cpp -o /tmp/discovery_parser_test
          /tmp/discovery_parser_test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic firmware/esp32s3/native-tests/programming_policy_test.cpp -o /tmp/programming_policy_test
          /tmp/programming_policy_test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic firmware/esp32s3/native-tests/binary_frame_test.cpp -o /tmp/binary_frame_test
          /tmp/binary_frame_test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic firmware/esp32s3/native-tests/frame_receiver_test.cpp -o /tmp/frame_receiver_test
          /tmp/frame_receiver_test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic firmware/esp32s3/native-tests/discovery_session_test.cpp -o /tmp/discovery_session_test
          /tmp/discovery_session_test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic firmware/esp32s3/native-tests/journal_record_test.cpp -o /tmp/journal_record_test
          /tmp/journal_record_test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic firmware/shared/native-tests/interprocessor_link_test.cpp -o /tmp/interprocessor_link_test
          /tmp/interprocessor_link_test
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic firmware/shared/native-tests/isotp_observer_test.cpp -o /tmp/isotp_observer_test
          /tmp/isotp_observer_test
  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - run: pio run -d firmware/esp32s3

  stm32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - run: pio run -d firmware/stm32g4
