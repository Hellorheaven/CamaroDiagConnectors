[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camarodiagconnectors"
version = "0.1.0"
requires-python = ">=3.11"
description = "CamaroDiagConnectors prototype host, discovery and offline memory tooling"

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
camarodiagconnectors = "camarodiagconnectors.__main__:main"
camarodiagconnectors-offline = "camarodiagconnectors.offline_cli:main"

[tool.setuptools]
packages = ["camarodiagconnectors"]
